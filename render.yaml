services:
  - type: web
    name: footballlive
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_PATH
        value: /var/data/footballlive.db
      - key: SESSION_SECRET
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: API_FOOTBALL_KEY
        sync: false
    disk:
      name: footballlive-data
      mountPath: /var/data
      sizeGB: 1
